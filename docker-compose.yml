services:
  neo4j:
    image: neo4j:5-community
    container_name: medsafe-neo4j
    ports:
      - "7474:7474"   # HTTP / Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-changeme_local_only}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-changeme_local_only} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  graph-loader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medsafe-graph-loader
    environment:
      MEDSAFE_GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme_local_only}
      NEO4J_DATABASE: neo4j
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      neo4j:
        condition: service_healthy
    command: >
      sh -c "python scripts/load_graph.py --processed-dir data/processed"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medsafe-api
    ports:
      - "8000:8000"
    environment:
      MEDSAFE_GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme_local_only}
      NEO4J_DATABASE: neo4j
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COVERAGE_MANIFEST: data/processed/ddinter_coverage.json
      COMBINATIONS_FILE: data/processed/combinations.csv
    depends_on:
      graph-loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready').read()"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: medsafe-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
